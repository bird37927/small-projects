<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能待办清单 - 我的第二个项目</title>
    <!-- 引入样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>我的待办清单</h1>
        
        <!-- 输入区域 -->
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="请输入任务并按回车...">
            <button id="add-btn">添加</button>
        </div>

        <!-- 双列布局容器 -->
        <div class="lists-wrapper">
            <!-- 未完成列 -->
            <div class="list-column">
                <h2>待处理 <span id="pending-count">0</span></h2>
                <ul id="pending-list" class="task-list"></ul>
                <p id="pending-empty" class="empty-msg">太棒了，任务都做完啦！</p>
            </div>

            <!-- 已完成列 -->
            <div class="list-column">
                <h2 class="completed-title">
                    已完成 <span id="completed-count">0</span>
                    <button id="clear-all" class="clear-btn">一键清空</button>
                </h2>
                <ul id="completed-list" class="task-list"></ul>
                <p id="completed-empty" class="empty-msg">还没有已完成的任务哦~</p>
            </div>
        </div>
    </div>

    <!-- 引入 JS 脚本 -->
    <script src="script.js"></script>
</body>
</html>
