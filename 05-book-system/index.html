<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端图书馆 | 项目五 Vue 实战</title>
    <!-- 引入 Tailwind CSS 负责外观 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 🌟 引入 Vue 3 (现代前端的核心) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Vue 控制的容器 -->
    <div id="app" class="max-w-4xl mx-auto p-6">
        
        <!-- 头部 -->
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-blue-600">📚 云端图书馆</h1>
            <button @click="openAddModal" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                添加书籍
            </button>
        </header>

        <!-- 搜索与筛选 -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-8 flex gap-4">
            <input v-model="searchQuery" type="text" placeholder="搜索书名或作者..." class="flex-1 border-gray-200 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
            <select v-model="filterCategory" class="border-gray-200 border rounded-lg px-4 py-2 outline-none">
                <option value="">所有分类</option>
                <option value="小说">小说</option>
                <option value="科技">科技</option>
                <option value="艺术">艺术</option>
            </select>
        </div>

        <!-- 图书列表 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 🌟 v-for 是 Vue 的循环魔法 -->
            <div v-for="(book, index) in filteredBooks" :key="index" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="inline-block px-2 py-1 text-xs font-semibold text-blue-600 bg-blue-50 rounded-md mb-2">{{ book.category }}</span>
                        <h3 class="text-xl font-bold mb-1">{{ book.title }}</h3>
                        <p class="text-gray-500 text-sm">作者：{{ book.author }}</p>
                    </div>
                    <button @click="removeBook(index)" class="text-red-400 hover:text-red-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                <div class="mt-4 flex justify-between items-center">
                        <span class="text-2xl font-bold text-orange-500">￥{{ book.price }}</span>
                        <button @click="openEditModal(book, index)" class="text-blue-600 text-sm font-medium hover:underline">编辑详情</button>
                    </div>
            </div>
        </div>

        <!-- 空状态 -->
        <div v-if="filteredBooks.length === 0" class="text-center py-20 text-gray-400">
            没有找到相关的书籍，换个关键词试试？
        </div>

        <!-- 🌟 项目五进阶：添加/编辑图书的弹窗 (Modal) -->
        <div v-if="showModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-in fade-in zoom-in duration-300">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">{{ isEditing ? '编辑图书' : '添加新书' }}</h2>
                    <button @click="closeModal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                </div>

                <form @submit.prevent="saveBook" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">书名</label>
                        <input v-model="currentBook.title" type="text" required placeholder="请输入书名" 
                               class="w-full border-gray-200 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">作者</label>
                        <input v-model="currentBook.author" type="text" required placeholder="请输入作者"
                               class="w-full border-gray-200 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">价格 (￥)</label>
                            <input v-model.number="currentBook.price" type="number" required placeholder="0.00"
                                   class="w-full border-gray-200 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                            <select v-model="currentBook.category" required
                                    class="w-full border-gray-200 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="小说">小说</option>
                                <option value="科技">科技</option>
                                <option value="艺术">艺术</option>
                                <option value="生活">生活</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-4 flex gap-3">
                        <button type="button" @click="closeModal" class="flex-1 px-4 py-2 border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition">取消</button>
                        <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-lg shadow-blue-200 transition">确定保存</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- 引入我们的脚本 -->
    <script src="app.js"></script>
</body>
</html>
