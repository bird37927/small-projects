<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的全栈博客 | 项目六</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="app" class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-blue-600">🚀 我的全栈博客</h1>

        <!-- 发布新文章表单 -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-10">
            <h2 class="text-xl font-bold mb-4 text-gray-700">✍️ 发布新博客</h2>
            <div class="space-y-4">
                <input v-model="newPost.title" type="text" placeholder="输入文章标题..." 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <textarea v-model="newPost.content" rows="4" placeholder="说点什么吧..." 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                <button @click="submitPost" 
                    class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                    发布文章
                </button>
            </div>
        </div>

        <!-- 博客列表 -->
        <div v-if="posts.length > 0">
            <div v-for="post in posts" :key="post._id" class="bg-white p-6 rounded-xl shadow-md mb-6">
                <h2 class="text-xl font-bold mb-2">{{ post.title }}</h2>
                <p class="text-gray-600 mb-4">{{ post.content }}</p>
                <div class="text-sm text-gray-400">发布于：{{ new Date(post.date).toLocaleString() }}</div>
            </div>
        </div>
        
        <div v-else class="text-center text-gray-500">
            正在从数据库加载文章...
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const posts = ref([]);
                const newPost = ref({
                    title: '',
                    content: ''
                });

                // 核心逻辑：从后端接口获取数据
                const fetchPosts = async () => {
                    try {
                        const res = await fetch('https://my-fullstack-blog-2026.onrender.com/api/posts');
                        posts.value = await res.json();
                    } catch (err) {
                        console.error("加载失败:", err);
                    }
                };

                // 核心逻辑：向后端发送新数据 (这就是把 Postman 的功能搬进网页)
                const submitPost = async () => {
                    if (!newPost.value.title || !newPost.value.content) {
                        alert("标题和内容都不能为空哦！");
                        return;
                    }

                    try {
                        const res = await fetch('https://my-fullstack-blog-2026.onrender.com/api/posts', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(newPost.value)
                        });

                        if (res.ok) {
                            // 发布成功后：清空输入框，重新获取列表
                            newPost.value.title = '';
                            newPost.value.content = '';
                            fetchPosts();
                            alert("🎉 发布成功！");
                        }
                    } catch (err) {
                        console.error("发布失败:", err);
                    }
                };

                onMounted(fetchPosts);

                return { posts, newPost, submitPost };
            }
        }).mount('#app');
    </script>
</body>
</html>
